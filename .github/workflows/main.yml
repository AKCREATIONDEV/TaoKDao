name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout karein
        uses: actions/checkout@v4

      - name: Java 17 setup karein
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Android SDK Licenses accept karein
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Gradle permission grant karein
        run: chmod +x gradlew

      # Yahan sirf :app module ka APK banega (.aar bundle nahi hoga)
      - name: Build APK only
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK Artifact Upload karein
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaoKDao-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
